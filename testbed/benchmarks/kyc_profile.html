<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citizen KYC Identity Verification</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .val { font-size: 15px; font-weight: 600; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Citizen Identity Records Verification</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Statutory identity registry records for e-KYC compliance.</p>

    <div class="field">
      <label>Primary Applicant</label>
      <div class="val">Ananya Iyer</div>
    </div>
    <div class="field">
      <label>Authorized Guardian</label>
      <div class="val">Smt. Priya Sharma</div>
    </div>
    <div class="field">
      <label>Aadhaar Number (UIDAI)</label>
      <div class="val">8493 3775 2953</div>
    </div>
    <div class="field">
      <label>Permanent Account Number (PAN)</label>
      <div class="val">BQKPI4821M</div>
    </div>
    <div class="field">
      <label>Voter ID (EPIC Card)</label>
      <div class="val">WBF1234567</div>
    </div>
    <div class="field">
      <label>Indian Passport Number</label>
      <div class="val">Z1234567</div>
    </div>
    <div class="field">
      <label>Date of Birth</label>
      <div class="val">1994-08-15 (15/08/1994)</div>
    </div>
    <div class="field">
      <label>Direct Contact</label>
      <div class="val">9123456789 | ananya.iyer@isro.res.in</div>
    </div>
  </div>
</body>
</html>
