<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Corporate NetBanking & Tax Settlement</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; border: 1px solid #334155; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .val { font-size: 15px; font-weight: 600; color: #38bdf8; }
    input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Corporate Tax Direct Debit Authorization</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Review corporate tax mandate and verify identity before statutory submission.</p>

    <div class="field">
      <label>Authorized Signatory</label>
      <div class="val">Dr. Vikram Sarabhai</div>
    </div>
    <div class="field">
      <label>Official Email</label>
      <div class="val">treasury.head@isro.gov.in</div>
    </div>
    <div class="field">
      <label>Registered Mobile</label>
      <div class="val">+919876543210</div>
    </div>
    <div class="field">
      <label>Corporate GSTIN (Mod-36 Verified)</label>
      <div class="val">29AAKCP5821Q1ZL</div>
    </div>
    <div class="field">
      <label>Corporate PAN</label>
      <div class="val">AAACA7890B</div>
    </div>
    <div class="field">
      <label>Aadhaar Identity</label>
      <div class="val">999999990019</div>
    </div>
    <div class="field">
      <label>Corporate Bank Account & IFSC</label>
      <div class="val">A/C: 987654321098 | IFSC: HDFC0000128</div>
    </div>
    <div class="field">
      <label>Master Authorization Password</label>
      <input type="password" value="NetBankPass#2026" id="auth_pwd">
    </div>
    <div class="field">
      <label>Statutory 2FA OTP</label>
      <input type="text" name="otp" value="849201" id="statutory_otp">
    </div>
  </div>
</body>
</html>
